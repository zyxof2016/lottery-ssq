<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>分档模型号码池与覆盖观察 · 双色球</title>
<link rel="stylesheet" href="static/app.css"><script src="static/shell.js"></script><script src="static/vendor/vue-3.5.24.js"></script><script src="static/pool-intersection.js"></script><script src="static/pool-compression.js"></script>
<style>
:root{font:14px system-ui,-apple-system,"Segoe UI",sans-serif;color:#172033;background:#f4f6f9}*{box-sizing:border-box}body{margin:0}header{background:#831d29;color:white;padding:22px max(20px,calc((100vw - 1180px)/2))}header a{color:#ffe4e6}h1{font-size:24px;margin:10px 0}h2{font-size:18px;margin:0 0 15px}p{line-height:1.7}a{color:#b91c1c}button,select{font:inherit;border:1px solid #cbd5e1;border-radius:7px;padding:9px 12px;background:white;color:#273449}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}.primary{background:#b91c1c;color:white;border-color:#b91c1c}main{max-width:1220px;margin:24px auto;padding:0 20px}.card{background:white;border:1px solid #e0e5ed;border-radius:12px;padding:22px;margin:0 0 18px;min-width:0}.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.muted{color:#64748b;font-size:12px}.notice{background:#fffbeb;border:1px solid #fde68a;color:#92400e;padding:13px;border-radius:8px;line-height:1.7;margin:14px 0}.error{background:#fff1f2;color:#9f1239;border-color:#fecdd3}.scroll{overflow-x:auto;max-width:100%}table{border-collapse:collapse;width:100%;font-size:13px;min-width:850px}th,td{padding:13px 11px;border-bottom:1px solid #e8edf3;text-align:left;vertical-align:top}th{color:#64748b;background:#f8fafc;white-space:nowrap}td small{display:block;color:#64748b;line-height:1.8}tr.active{background:#fff1f2}.balls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:18px 0}.ball{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;font:600 13px ui-monospace,monospace;background:#fff1f2;border:1px solid #fda4af;color:#be123c}.ball.blue{background:#eff6ff;border-color:#93c5fd;color:#1d4ed8}.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:18px 0}.metric{background:#f8fafc;padding:15px;border-radius:8px}.metric strong{font-size:24px;display:block;margin:7px 0}.links{display:flex;gap:18px;flex-wrap:wrap}code{font-size:11px;overflow-wrap:anywhere}[v-cloak]{display:none}@media(max-width:600px){main{padding:0 12px;margin:14px auto}.card{padding:16px}header{padding:18px 16px}.metrics{grid-template-columns:1fr}.toolbar select{max-width:100%}.ball{width:30px;height:30px}}
</style>
<style>
.tier-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:18px 0}.tier{border:1px solid #e0e5ed;border-radius:10px;padding:17px;min-width:0}.tier h3{margin:0;font-size:16px}.tier .balls{gap:6px;margin:13px 0}.tier .ball{width:30px;height:30px}.tier .ball.added{outline:2px dashed #d97706;outline-offset:1px}.tier .toolbar{justify-content:space-between}.tier small{line-height:1.7}.observation-table{min-width:720px}.period-links{display:flex;gap:10px;flex-wrap:wrap}.period-links a{padding:8px 10px;background:#f8fafc;border-radius:6px;font-size:12px}@media(max-width:700px){.tier-grid{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body><div id="app" v-cloak>
<header><div class="links"><a :href="home">← 选号首页</a><a :href="reviewsUrl">每期实际留档与复盘</a></div><h1>分档模型号码池与覆盖观察</h1><div>14／16／18／20／22／24 红六档，观察少选号码与全 6 红覆盖的取舍</div></header>
<main>
<div v-if="error" class="notice error" role="alert">{{ error }}</div>
<div v-if="!report && !error" class="card" role="status">正在逐期核对不同大小的号码池…</div>
<template v-if="report">
<pool-intersection :api-url="intersectionApiUrl" :snapshot="report"></pool-intersection>
<section class="card" aria-label="分档模型号码池">
<h2>第 {{ next.issue || report.suggested_target }} 期 · 六档模型号码池</h2>
<p class="muted">依据截止 {{ report.cutoff_issue }}（{{ report.cutoff_date }}）的开奖，{{ previewModels.length }}套红球模型按相同数量对照，蓝球共用协议加权排名。每个模型的大档逐层包含小档，虚线圈标出新增红球；档位表示数量。当前展示为预览，实际档案以首次封存为准。</p>
<div class="toolbar"><label for="tier-model">观察红球模型</label><select id="tier-model" v-model="tierModel"><option v-for="(m,i) in previewModels.map(m=>m.model)" :key="m" :value="m">{{ modelName(m) }}</option></select><label for="tier-blue">观察蓝球数量</label><select id="tier-blue" v-model.number="blueCount"><option v-for="n in report.blue_sizes" :key="n" :value="n">{{ n }} 个</option></select></div>
<details id="tier-compression"><summary>14–24红压缩损失与实际留档对照</summary><label class="toolbar" style="margin-top:14px" for="joint-red-count">覆盖归因的红球数量<select id="joint-red-count" v-model.number="jointRedCount"><option v-for="n in [14,16,18,20,22,24]" :key="n" :value="n">{{ n }} 红</option></select></label><pool-compression :curves="tierCompressionWindow?.red_curves||tierCompressionWindow?.cells||[]" :window="tierCompressionWindow" :actual="observations?.compression_cells||[]" :model="tierModel" :red-count="jointRedCount" :blue-count="blueCount"></pool-compression></details>
<div class="tier-grid"><article v-for="t in tiers" :key="t.id" class="tier" :data-tier="t.id">
<div class="toolbar"><h3>{{ t.label }} · {{ t.red_count }} 红 + {{ blueCount }} 蓝</h3><a v-if="!['uniform','repeat_calibrated','conditional_gap','rank_consensus','scenario_cover','robust_cover','dual_support'].includes(tierModel)" href="#pool-replay" @click="model=tierModel;redCount=t.red_count">查看 {{ t.red_count }} 红历史</a><a v-else-if="['rank_consensus','scenario_cover','robust_cover','dual_support'].includes(tierModel)" href="#algorithm-study" @click="algorithmChoice=tierModel">查看全覆盖算法比较</a><a v-else-if="tierModel==='conditional_gap'" href="#full6-study">查看全6红覆盖复盘</a><a v-else-if="tierModel==='repeat_calibrated'" href="#ranking-study">查看同档位排名复盘</a><span v-else class="muted">固定种子均匀红球对照</span></div>
<div class="balls"><span v-for="n in sorted(t.reds)" :key="n" class="ball" :class="{added:t.id!=='A'&&t.added_reds.includes(n)}" :title="t.id!=='A'&&t.added_reds.includes(n)?'比前一档新增':'该档红球'">{{ pad(n) }}</span></div>
<div class="balls"><span class="muted">蓝球</span><span v-for="n in sorted(t.blues)" :key="n" class="ball blue">{{ pad(n) }}</span></div>
<small class="muted">{{ t.id==='A'?'基础池':'比前一档新增：'+sorted(t.added_reds).map(pad).join(' ') }}。{{ t.actual.n ? '实际留档全6红：'+t.actual.full_red_periods+'/'+t.actual.n+'期（'+percent(t.actual.full_red_rate)+'）' : '实际留档暂无已开奖样本' }}</small>
</article></div>
<div class="toolbar"><button @click="exportTiers">导出六档观察池 JSON</button><button class="primary" @click="freeze" :disabled="busy || !next.can_freeze">封存下一期六档观察池 · {{ next.issue || '待核对' }}</button><a v-if="archiveUrl" :href="archiveUrl">查看实际号码池留档</a></div>
<div v-if="message" class="notice" role="status">{{ message }}</div><p class="muted">{{ next.reason }}。后续新期首次冻结{{ previewModels.length }}个模型各18个观察池，另保留原有9个小池，共{{ previewModels.length*18+9 }}个池。已有档案保持首次版本，不追加模型。</p>
</section>
<section v-if="observations" class="card" aria-label="实际分档覆盖统计">
<h2>实际留档覆盖观察 · {{ modelName(tierModel) }}</h2>
<p class="muted">{{ observations.note }}</p>
<div v-if="observations.errors.length" class="notice error" role="alert">部分档案未计入：{{ observations.errors.join('；') }}</div>
<p v-if="actualCells.every(c=>c.n===0)" class="notice">六档尚无已开奖的留档样本，实际全包率暂为空；待开奖不计为未命中。</p>
<div class="scroll"><table class="observation-table"><thead><tr><th>档位</th><th>已开奖 / 待开奖</th><th>全 6 红次数 / 比例</th><th>平均中红 / 漏红</th><th>辅助：6 红 1 蓝全包</th></tr></thead><tbody><tr v-for="c in actualCells" :key="c.red_count"><td>{{ c.red_count }} 红 + {{ blueCount }} 蓝</td><td>{{ c.n }} / {{ c.pending }} 期</td><td>{{ c.n ? c.full_red_periods+' / '+c.n+' 期' : '—' }}<small>{{ percent(c.full_red_rate) }}</small></td><td>{{ decimal(c.mean_red_hits) }} / {{ decimal(c.mean_missed_reds) }}</td><td>{{ c.n ? c.full_draw_periods+' / '+c.n+' 期' : '—' }}<small>{{ percent(c.full_draw_rate) }}</small></td></tr></tbody></table></div>
<p v-if="observations.missing_tier_archives" class="muted">另有 {{ observations.missing_tier_archives }} 期每日档案没有保存六档，保持缺档，不补造历史观察池。</p>
<div class="period-links" style="margin-top:16px"><a v-for="p in observations.periods.slice().reverse().slice(0,30)" :key="p.issue" :href="issueUrl(p.issue)">{{ p.issue }} · {{ p.pending?'待开奖':periodTier(p)?periodTier(p)+'红为最小全包档':'六档均未全包或未保存该模型' }}</a></div>
</section>
<section v-if="observations" class="card" aria-label="三模型共同期次对照">
<h2>同数量、共同期次的三模型对照</h2><p class="muted">只统计三套模型在同一期都提前保存的号码池，待开奖不计入比例。各模型单独累计样本可能不同，模型比较以下表共同样本为准。</p><p class="notice">{{ observations.first_comparison_issue ? '首次三模型档案：'+observations.first_comparison_issue+' 期。' : '尚无三模型共同档案；当前旧期只保存加权模型，后续新期开始对照。' }}{{ observations.comparison_policy.note }}</p>
<div class="scroll"><table class="observation-table"><thead><tr><th>档位</th><th>共同已开奖 / 待开奖</th><th>加权融合</th><th>等权融合</th><th>均匀红球对照</th><th>缺少对照的期次</th></tr></thead><tbody><tr v-for="c in pairedCells" :key="c.red_count"><td>{{ c.red_count }} 红 + {{ blueCount }} 蓝</td><td>{{ c.n }} / {{ c.pending }} 期</td><td v-for="m in c.models" :key="m.model"><b>{{ percent(m.full_red_rate) }}</b><small>全6红 {{ m.n?m.full_red_periods+'/'+m.n:'—' }} · 平均漏红 {{ decimal(m.mean_missed_reds) }}</small><small>至少5红 {{ m.n?m.at_least_5_red_periods+'/'+m.n:'—' }}</small><small v-if="m.full_red_wilson95">描述性区间 {{ percent(m.full_red_wilson95[0]) }}–{{ percent(m.full_red_wilson95[1]) }}</small></td><td>{{ c.excluded_missing_comparison }} 期</td></tr></tbody></table></div><p class="muted">全6红率为主指标，平均漏红为辅助；原排名的最小全包前缀可在逐期复盘查看。比较结果用于观察，系统不按近期胜率自动替换模型或改变档位。</p>
</section>
<section v-if="algorithmStudy" id="algorithm-study" class="card" aria-label="新增全覆盖算法比较">
<h2>新增算法 · 同数量全覆盖观察</h2><p>各试验算法分别留档，以全部6个红球入池为主指标，同时核对6红1蓝全入池。默认16红不变；历史成绩不能保证每期全覆盖。</p>
<div class="toolbar"><label for="algorithm-model">算法</label><select id="algorithm-model" v-model="algorithmChoice"><option v-for="p in algorithmStudy.policies" :key="p.model" :value="p.model">{{ p.label }}</option></select><label for="algorithm-window">共同回放窗口</label><select id="algorithm-window" v-model="algorithmWindow"><option value="recent30">近30期</option><option value="recent60">近60期</option><option value="recent156">近156期</option><option value="confirmation_exploratory">原确认窗 · 探索性</option><option value="development">开发历史</option><option value="tracking">确认窗后跟踪</option><option value="all_oos">全部历史</option></select><button @click="exportAlgorithms">导出算法复盘</button></div>
<p class="muted">{{ algorithmStudy.policies.find(p=>p.model===algorithmChoice)?.note }}</p>
<p v-if="algorithmSummary" class="notice">历史因果回放 {{ algorithmSummary.from }}—{{ algorithmSummary.to }}，共{{ algorithmSummary.n }}期。以下两套排名使用相同红球数量和同一蓝球前{{ blueCount }}名；这不是实际发布实绩。</p>
<div v-if="algorithmSummary" class="scroll"><table class="observation-table" id="algorithm-history-table"><thead><tr><th>红球数</th><th>原排名全6红</th><th>所选算法全6红</th><th>平均漏红：原 / 新</th><th>6红1蓝全包：原 / 新（{{ blueCount }}蓝）</th></tr></thead><tbody><tr v-for="k in [14,16,18,20,22,24]" :key="k"><td>{{ k }}</td><td v-for="m in ['weighted',algorithmChoice]" :key="m">{{ algorithmCell(m,k)?.full_red_periods }}/{{ algorithmSummary.n }} · {{ percent(algorithmCell(m,k)?.full_red_rate) }}</td><td>{{ decimal(algorithmCell('weighted',k)?.mean_missed_reds) }} / {{ decimal(algorithmCell(algorithmChoice,k)?.mean_missed_reds) }}</td><td>{{ algorithmCell('weighted',k)?.full_draw_periods_by_blue[blueCount-1] }} / {{ algorithmCell(algorithmChoice,k)?.full_draw_periods_by_blue[blueCount-1] }}</td></tr></tbody></table></div>
<h3>共同冻结期次 · 实际全覆盖</h3><p class="muted">{{ observations?.first_algorithm_issues?.[algorithmChoice]?'首次留档：'+observations.first_algorithm_issues[algorithmChoice]+'期。':'所选算法尚无每日冻结档案。' }}旧期缺少新算法时排除，不补造；待开奖不计入覆盖比例。</p>
<div class="scroll"><table class="observation-table" id="algorithm-actual-table"><thead><tr><th>规格</th><th>共同已开奖 / 待开奖</th><th>原排名全6红</th><th>所选算法全6红</th><th>6红1蓝全包：原 / 新</th><th>缺少算法期数</th></tr></thead><tbody><tr v-for="c in algorithmActual" :key="c.red_count"><td>{{ c.red_count }}红＋{{ blueCount }}蓝</td><td>{{ c.n }} / {{ c.pending }}</td><td v-for="m in c.models" :key="m.model">{{ m.n?m.full_red_periods+'/'+m.n:'—' }} · {{ percent(m.full_red_rate) }}</td><td>{{ c.n?c.models.map(m=>m.full_draw_periods+'/'+m.n).join(' / '):'—' }}</td><td>{{ c.excluded_missing_comparison }}</td></tr></tbody></table></div>
</section>
<section v-if="full6" id="full6-study" class="card" aria-label="24红及以下全6红优化">
<h2>24红及以下 · 全6红覆盖优化</h2><p>{{ full6.policy.note }}</p>
<div class="toolbar"><label for="full6-window">共同回放窗口</label><select id="full6-window" v-model="full6Window"><option value="recent30">近30期</option><option value="recent60">近60期</option><option value="recent156">近156期</option><option value="confirmation_exploratory">原确认窗 · 探索性</option><option value="development">开发历史</option><option value="all_oos">全部历史</option></select><button @click="exportFull6">导出全6红复盘</button></div>
<p class="notice">截至 {{ full6.cutoff_issue }}，近60期24红全包：原排名 {{ recentFull24.original }}/{{ recentFull24.n }}，条件频率 {{ recentFull24.candidate }}/{{ recentFull24.n }}。请同时查看长历史及14–22红结果；近期改善不代表稳定优势，预览不计作实际推荐。</p>
<div v-if="full6Summary" class="scroll"><table class="observation-table"><thead><tr><th>红球数</th><th>原排名全6红 / 比例</th><th>条件频率全6红 / 比例</th><th>原平均漏红 / 新平均漏红</th><th>同大小均匀全包基准</th></tr></thead><tbody><tr v-for="k in [14,16,18,20,22,24]" :key="k"><td>{{ k }} 红</td><td v-for="m in ['weighted','conditional_gap']" :key="m">{{ full6Cell(m,k)?.full_red_periods }}/{{ full6Summary.n }} · {{ percent(full6Cell(m,k)?.full_red_rate) }}</td><td>{{ decimal(full6Cell('weighted',k)?.mean_missed_reds) }} / {{ decimal(full6Cell('conditional_gap',k)?.mean_missed_reds) }}</td><td>{{ percent(full6Cell('weighted',k)?.uniform_full_red_rate) }}</td></tr></tbody></table></div>
<h3>共同冻结期次 · 实际覆盖</h3><p class="muted">{{ observations?.first_conditional_issue?'首次条件频率每日档案：'+observations.first_conditional_issue+'期。':'尚无条件频率每日档案，从后续新期首次冻结开始观察。' }}已冻结期次保留原版，未保存新模型的期次不补造、不计入对照。</p>
<div class="scroll"><table class="observation-table"><thead><tr><th>档位</th><th>共同已开奖 / 待开奖</th><th>原排名全6红</th><th>条件频率全6红</th></tr></thead><tbody><tr v-for="c in (observations?.conditional_paired_cells||[]).filter(c=>c.blue_count===blueCount)" :key="c.red_count"><td>{{ c.red_count }}红 + {{ blueCount }}蓝</td><td>{{ c.n }} / {{ c.pending }}</td><td v-for="m in c.models" :key="m.model">{{ m.n?m.full_red_periods+'/'+m.n:'—' }} · {{ percent(m.full_red_rate) }}</td></tr></tbody></table></div>
</section>
<section v-if="coverageStudy" id="ranking-study" class="card" aria-label="新旧排名同档位比较">
<h2>排名优化 · 重号偏置校准试验</h2>
<p>{{ coverageStudy.ranking_policy.note }}</p>
<div class="toolbar"><label for="ranking-window">同档位历史回放</label><select id="ranking-window" v-model="coverageWindow"><option value="recent30">近30期</option><option value="recent60">近60期</option><option value="confirmation_exploratory">原确认窗 · 探索性</option><option value="development">开发历史</option><option value="all_oos">全部因果回放</option></select><button @click="exportCoverage">导出排名复盘 JSON</button></div>
<p class="notice">这次改变红球评分与排名；两套排名使用相同红球数量和同一蓝球排序。历史结果有升有降，校准排名尚未证实提高未来全6红率。当前预览不计作历史实际推荐。</p>
<div v-if="coverageSummary" class="scroll"><table class="observation-table"><thead><tr><th>红球数量</th><th>排序方法</th><th>全6红次数 / 比例</th><th>平均中红 / 漏红</th><th>平均包含上期红球</th></tr></thead><tbody><tr v-for="c in coverageSummary.cells.filter(c=>['weighted','repeat_calibrated'].includes(c.model)).slice().sort((a,b)=>a.red_count-b.red_count)" :key="c.model+c.red_count"><td>{{ c.red_count }} 红</td><td>{{ modelName(c.model) }}</td><td>{{ c.full_red_periods }}/{{ c.n }} · {{ percent(c.full_red_rate) }}</td><td>{{ decimal(c.mean_red_hits) }} / {{ decimal(c.mean_missed_reds) }}</td><td>{{ decimal(c.mean_previous_selected) }}</td></tr></tbody></table></div>
<h3>新旧排名的实际共同留档</h3><p class="muted">{{ observations?.first_ranking_issue ? '首次保存校准排名：'+observations.first_ranking_issue+'期。' : '尚无校准排名的每日档案；已冻结期次不追加，从后续新期开始。' }}只有两套排名都提前保存的期次才进入下表。</p>
<div class="scroll"><table class="observation-table"><thead><tr><th>规格</th><th>共同已开奖 / 待开奖</th><th>原加权排名</th><th>校准排名试验</th></tr></thead><tbody><tr v-for="c in (observations?.ranking_paired_cells||[]).filter(c=>c.blue_count===blueCount)" :key="c.red_count"><td>{{ c.red_count }}红 + {{ blueCount }}蓝</td><td>{{ c.n }} / {{ c.pending }}</td><td v-for="m in c.models" :key="m.model">全6红 {{ m.n?m.full_red_periods+'/'+m.n:'—' }}<small>平均漏红 {{ decimal(m.mean_missed_reds) }}</small></td></tr></tbody></table></div>
</section>
<section v-if="coverageStudy" class="card" aria-label="覆盖复盘与组票优化">
<h2>覆盖复盘与组票优化</h2><p class="muted">截至 {{ coverageStudy.cutoff_issue }} 的因果回放，逐期只使用此前数据；以下历史试算未作为当期推荐发布，实际成绩仍以原始留档为准。</p>
<div class="notice">最近一期 {{ coverageStudy.latest_replay.issue }}，原融合的6个开奖红球名次为 {{ coverageStudy.latest_replay.models[0].winning_red_ranks.join('、') }}；蓝球名次 {{ coverageStudy.latest_replay.weighted_blue_rank }}。漏在排名后段的号码，池内组票无法补回。</div>
<div class="toolbar"><label for="coverage-window">复盘窗口</label><select id="coverage-window" v-model="coverageWindow"><option value="recent30">近30期</option><option value="recent60">近60期</option><option value="confirmation_exploratory">原确认窗 · 探索性</option><option value="tracking">确认窗后跟踪</option></select><button @click="exportCoverage">导出覆盖复盘 JSON</button></div>
<p class="muted">同预算均为8注16元。先比较原12码池，再比较同一套融合前14码；较大号码池带来的增量单独列出。</p>
<div v-if="coverageSummary" class="scroll"><table class="observation-table"><thead><tr><th>票组方法</th><th>回放期数</th><th>实际入票不同红球</th><th>平均覆盖开奖号</th><th>单注最好红球</th><th>最大单号曝光</th></tr></thead><tbody><tr v-for="(name,k) in coverageTicketNames" :key="k"><td>{{ name }}</td><td>{{ coverageSummary.tickets[k]?.n || 0 }}</td><td>{{ decimal(coverageSummary.tickets[k]?.means.red_union) }}</td><td>{{ decimal(coverageSummary.tickets[k]?.means.red_hits) }}/6</td><td>{{ decimal(coverageSummary.tickets[k]?.means.best_red) }}</td><td>{{ decimal(coverageSummary.tickets[k]?.means.max_exposure) }}/8 注</td></tr></tbody></table></div>
<p class="notice">新版均衡组票完整使用所选红球池，并限制每个号码的曝光；14红8注时每红出现3–4次。保持原融合排名，单注中奖与池内全包分别统计。已冻结旧期保持原票面，后续新期首次留档新增均衡票组。</p>
<details><summary>未采用的排名试验：均衡排名</summary><p class="muted">{{ coverageStudy.adoption.reason }}。试验只在本研究区域展示，不进入自动推荐或覆盖观察成绩。</p><div v-if="coverageSummary" class="scroll"><table class="observation-table"><thead><tr><th>排序</th><th>红球数</th><th>全6红次数 / 比例</th><th>平均中红</th><th>平均包含上期红球</th></tr></thead><tbody><tr v-for="c in coverageSummary.cells.filter(c=>c.model!=='repeat_calibrated'&&[14,18,24].includes(c.red_count))" :key="c.model+c.red_count"><td>{{ ({weighted:'原加权融合',equal:'等权融合',balanced_rank:'均衡排名试验'})[c.model] }}</td><td>{{ c.red_count }}</td><td>{{ c.full_red_periods }}/{{ c.n }} · {{ percent(c.full_red_rate) }}</td><td>{{ decimal(c.mean_red_hits) }}</td><td>{{ decimal(c.mean_previous_selected) }}</td></tr></tbody></table></div></details>
</section>
<section id="pool-replay" class="card" aria-label="历史红球数量回放">
<h2>先看全 6 红率，再权衡数量</h2>
<p class="muted">数据截止 {{ report.cutoff_issue }}（{{ report.cutoff_date }}）。这是按真实开奖进行的历史因果回放，每期只使用之前的数据；实际推荐表现请查看每期留档。主指标是全部 6 个开奖红球入池的期数比例，蓝球仅作辅助。</p>
<div class="toolbar"><label for="pool-window">观察窗口</label><select id="pool-window" v-model="window"><option value="recent30">最近30期</option><option value="recent60">最近60期</option><option value="confirmation">原冻结确认窗 · 探索性复盘</option><option value="tracking">确认窗后的跟踪期</option><option value="all_oos">全部因果回放</option></select><label for="pool-model">红球排序</label><select id="pool-model" v-model="model"><option v-for="m in report.next.candidate_models" :key="m.model" :value="m.model">{{ m.label }}</option></select></div>
<div class="toolbar" style="margin-top:12px"><label for="range-min">比较数量</label><select id="range-min" v-model.number="rangeMin"><option v-for="n in report.red_sizes.filter(n=>n<=rangeMax)" :key="n" :value="n">{{ n }} 红</option></select><span>至</span><label for="range-max" class="muted">上限</label><select id="range-max" v-model.number="rangeMax"><option v-for="n in report.red_sizes.filter(n=>n>=rangeMin)" :key="n" :value="n">{{ n }} 红</option></select><label for="compare-blue">辅助蓝球数量</label><select id="compare-blue" v-model.number="blueCount"><option v-for="n in report.blue_sizes" :key="n" :value="n">{{ n }} 蓝</option></select></div>
<p v-if="observed" class="muted">{{ observed.from }}—{{ observed.to }}，共 {{ observed.n }} 个真实开奖样本。各红球排序共用同一份冻结蓝球排序。</p>
<div v-if="observed && cells.every(c=>c.full_red_periods===0)" class="notice">当前窗口、排序和数量范围内，全 6 红次数均为 0，尚无法按全包表现区分规格。</div>
<div v-if="observed" class="scroll"><table>
<thead><tr><th>红球数量</th><th>全 6 红次数 / 比例</th><th>同大小均匀基准</th><th>比少 1 红新增全包</th><th>平均中红 / 漏红</th><th>至少 5 红</th><th>辅助：6 红 1 蓝全包</th></tr></thead>
<tbody><tr v-for="c in cells" :key="c.red_count" :class="{active:c.red_count===redCount}"><td><button @click="redCount=c.red_count" :aria-label="'预览'+c.red_count+'个红球'" style="white-space:nowrap">{{ c.red_count }} 红</button></td><td><b>{{ c.full_red_periods }} / {{ observed.n }} 期 · {{ percent(c.full_red_rate) }}</b><small>描述性区间 {{ percent(c.full_red_wilson95[0]) }}–{{ percent(c.full_red_wilson95[1]) }}</small></td><td>{{ percent(c.uniform_full_red_rate) }}<small>实测差值 {{ points(c.full_red_rate_excess) }} 个百分点</small></td><td>{{ c.additional_full_red_periods===null ? '—' : '+'+c.additional_full_red_periods+' 期' }}<small v-if="c.additional_full_red_periods===0">本窗口全包次数未增加</small></td><td>{{ decimal(c.mean_red_hits) }} / {{ decimal(c.mean_missed_reds) }}<small>平均找回 {{ percent(c.red_draw_recall) }} 开奖红球</small></td><td>{{ c.at_least_5_red_periods }} / {{ observed.n }} 期</td><td>{{ c.full_draw_periods_by_blue[blueCount-1] }} / {{ observed.n }} 期<small>{{ blueCount }} 个蓝球；同时全包 {{ percent(c.full_draw_periods_by_blue[blueCount-1]/observed.n) }}</small></td></tr></tbody>
</table></div>
<p v-else class="notice">这个窗口尚无可用开奖样本。</p>
<p v-if="observed" class="muted">当前范围内，全包次数相同时保留较少红球：{{ frontierText }}。这里只描述本窗口的历史结果，不自动挑选下一期最优档。</p>
<p class="muted">全 6 红均匀基准 = C(红球数量, 6) / C(33, 6)。多选号码本身就会提高全包率，应同时看相同大小的基准。所有排序均可查看，历史率和描述性区间不能当作下一期覆盖承诺。</p>
</section>
<section class="card">
<h2>手动查看号码池 · 研究预览</h2>
<div class="toolbar"><label for="red-count">红球数量</label><select id="red-count" v-model.number="redCount"><option v-for="n in report.red_sizes" :key="n" :value="n">{{ n }} 个</option></select><label for="blue-count">蓝球数量</label><select id="blue-count" v-model.number="blueCount"><option v-for="n in report.blue_sizes" :key="n" :value="n">{{ n }} 个</option></select><span class="muted">当前排序：{{ nextModel.label }}</span></div>
<div class="balls"><span class="muted">红球</span><span v-for="n in reds" :key="n" class="ball">{{ pad(n) }}</span></div>
<div class="balls"><span class="muted">蓝球</span><span v-for="n in blues" :key="n" class="ball blue">{{ pad(n) }}</span></div>
<div v-if="selectedCell && observed" class="metrics"><div class="metric"><span class="muted">当前数量的历史全 6 红率</span><strong>{{ percent(selectedCell.full_red_rate) }}</strong><span class="muted">{{ selectedCell.full_red_periods }} / {{ observed.n }} 期；不代表下一期概率</span></div><div class="metric"><span class="muted">当前数量的历史平均漏红</span><strong>{{ decimal(selectedCell.mean_missed_reds) }}</strong><span class="muted">个 / 期</span></div><div class="metric"><span class="muted">辅助：历史 6 红 1 蓝全包</span><strong>{{ selectedCell.full_draw_periods_by_blue[blueCount-1] }} / {{ observed.n }}</strong><span class="muted">期；蓝球池 {{ blueCount }} 个</span></div></div>
<p class="muted">这里的自选排序和数量仅供研究。各模型实际观察采用各自提前冻结的六档；只有成功封存后才计入实际留档观察，不展开复式。</p>
<div class="toolbar"><button @click="exportPool">导出当前研究池 JSON</button></div>
</section>
<section class="card"><h2>验证口径</h2><p class="muted" v-for="note in report.notes" :key="note">{{ note }}</p><details><summary>输入与版本摘要</summary><p class="muted">数据：<code>{{ report.data_sha256 }}</code></p><p class="muted">研究源码：<code>{{ report.source_sha256 }}</code></p></details></section>
</template>
</main></div>
<script>
const {createApp,ref,computed,onMounted}=Vue;
createApp({components:{PoolIntersection:SSQPoolIntersection.component,PoolCompression:SSQPoolCompression.component},setup(){
const base=new URL(location.href);base.pathname=base.pathname.replace(/pools(?:\.html)?\/?$/,'');base.search='';base.hash='';
const intersectionApiUrl=new URL('api/pools',base).href;
const home=base.pathname,reviewsUrl=new URL('reviews',base).href,report=ref(null),observations=ref(null),window=ref('confirmation'),model=ref('weighted'),tierModel=ref('conditional_gap'),full6=ref(null),full6Window=ref('recent60'),coverageStudy=ref(null),coverageWindow=ref('recent60'),algorithmStudy=ref(null),algorithmChoice=ref('rank_consensus'),algorithmWindow=ref('recent60'),rangeMin=ref(14),rangeMax=ref(24),jointRedCount=ref(16),redCount=ref(14),blueCount=ref(2),error=ref(''),message=ref(''),next=ref({}),busy=ref(false),archiveUrl=ref('');
const coverageSummary=computed(()=>coverageStudy.value?.windows[coverageWindow.value]),coverageTicketNames={frozen:'原冻结8注',balanced_same12:'同原12码池 · 均衡8注',weighted14_greedy:'融合前14码 · 原组票',weighted14_balanced:'融合前14码 · 均衡8注'};
const modelName=m=>({weighted:'协议加权融合',equal:'等权融合',uniform:'均匀红球对照',repeat_calibrated:'重号偏置校准 · 试验',rank_consensus:'名次共识 · 试验',scenario_cover:'全6情景覆盖 · 试验',robust_cover:'三窗稳健覆盖 · 试验',dual_support:'双专家支持 · 24红试验',conditional_gap:'条件频率 · 24红试验'}[m]||m);
const actualCells=computed(()=>(observations.value?.comparison_cells || []).filter(c=>c.model===tierModel.value&&c.blue_count===blueCount.value));
const pairedCells=computed(()=>(observations.value?.paired_cells || []).filter(c=>c.blue_count===blueCount.value));
const previewModels=computed(()=>report.value?[{model:'weighted',...report.value.next.weighted_pools},...report.value.next.weighted_pools.comparison_models,...(report.value.next.weighted_pools.coverage_model?[report.value.next.weighted_pools.coverage_model]:[]),...(report.value.next.weighted_pools.algorithm_models||[])]:[]);
const previewModel=computed(()=>previewModels.value.find(m=>m.model===tierModel.value));
const recentFull24=computed(()=>{const w=full6.value?.windows.recent60;return {n:w?.n,original:w?.cells.find(c=>c.model==='weighted'&&c.red_count===24)?.full_red_periods,candidate:w?.cells.find(c=>c.model==='conditional_gap'&&c.red_count===24)?.full_red_periods};});

const pad=n=>String(n).padStart(2,'0'),sorted=ns=>ns.slice().sort((a,b)=>a-b),decimal=n=>n==null?'—':Number(n).toFixed(2),percent=(n,d=2)=>n==null?'—':(Number(n)*100).toFixed(d)+'%',points=n=>(n>=0?'+':'')+(n*100).toFixed(2);
function full6Cell(model,size){return full6Summary.value?.cells.find(c=>c.model===model&&c.red_count===size);}
function periodTier(p){return p.model_diagnostics?.find(m=>m.model===tierModel.value)?.smallest_full_red_tier;}
function issueUrl(issue){const url=new URL('reviews',base);url.searchParams.set('issue',issue);url.searchParams.set('archive','daily');return url.href;}
async function api(path,options){const r=await fetch(new URL(path,base),options),data=await r.json();if(!r.ok)throw Error(data.error||'读取失败');return data;}
async function load(){try{const [data,index,actual,coverage,allSix,algorithms]=await Promise.all([api('api/pools'),api('api/recommendations/issues?limit=1'),api('api/pools/observations'),api('api/coverage'),api('api/full6'),api('api/pool-algorithms')]);report.value=data;next.value=index.next;observations.value=actual;coverageStudy.value=coverage;full6.value=allSix;algorithmStudy.value=algorithms;}catch(e){error.value=e.message;}}

function exportFull6(){download(full6.value,`ssq-full6-review-${full6.value.cutoff_issue}.json`);}
function exportCoverage(){download(coverageStudy.value,`ssq-coverage-review-after-${coverageStudy.value.cutoff_issue}.json`);}

function exportPool(){const data={kind:'small_pool_research_preview',version:report.value.version,actual_recommendation:false,data_cutoff:report.value.cutoff_issue,input_history_sha256:report.value.data_sha256,source_sha256:report.value.source_sha256,model:model.value,reds:reds.value,blues:blues.value,red_count:redCount.value,blue_count:blueCount.value,note:'自选研究预览未封存；实际观察为各模型提前冻结的六档。'};download(data,`ssq-research-${data.red_count}red-${data.blue_count}blue-after-${data.data_cutoff}.json`);}

}}).mount('#app');
</script></body></html>

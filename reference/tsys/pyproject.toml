[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tsys-probability-experiment"
version = "0.2.0"
description = "Historical lottery-probability experiment with auditable no-signal controls"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
  "numpy==2.1.3",
  "pandas==2.3.0",
  "scikit-learn==1.6.1",
  "xgboost==3.0.2",
  "lightgbm==4.7.0",
  "matplotlib==3.10.3",
  "PyYAML==6.0.2",
  "scipy==1.15.3",
  "openpyxl==3.1.5",
  "optuna==4.4.0",
  "PuLP==3.3.2",
  "catboost==1.2.10",
  "pytest==8.3.5",
]

[project.scripts]
tsys = "src.app.cli:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["src*", "compliance*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*", "*Test"]
python_functions = ["test_*"]
addopts = "-ra"
markers = [
  "slow: 长耗时回测或完整实验测试，日常可用 -m 'not slow' 跳过",
  "integration: 需要真实数据、外部依赖或较完整流程的集成测试",
]
